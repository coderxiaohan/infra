services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /:/host:ro,rslave
      - ${INFERLAB_TEXTFILE_DIR:-../results/tables}:/textfile:ro

  prometheus:
    image: prom/prometheus:v2.53.1
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in a private env file or shell}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana_dashboard.json:/var/lib/grafana/dashboards/inferlab.json:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
