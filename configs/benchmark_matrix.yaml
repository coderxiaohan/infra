# Initial benchmark matrix for M0/M1 smoke runs.
# Larger model, vLLM, CUDA, TensorRT-LLM, and llama.cpp matrices are added later.

runs:
  - name: kv_shape_probe_small
    module: mini_llm.shape_probe
    backend: python
    model_family: shape-only
    precision: fp16
    batch_size: 1
    seq_len: 128
    decode_steps: 16
    num_layers: 12
    num_heads: 12
    head_dim: 64

  - name: mini_workload_profile_128x16
    module: mini_llm.workload_profile
    backend: python
    prompt_tokens: 128
    output_tokens: 16
    output: results/raw/mini_transformer_workload_profile.json

  - name: vllm_preflight
    script: scripts/run_vllm_benchmark.py
    backend: vllm
    model: model
    output: results/raw/vllm_serving_benchmark.json

  - name: trtllm_preflight
    script: scripts/run_trtllm_benchmark.py
    backend: trtllm
    engine_dir: engines/model
    output: results/raw/trtllm_benchmark.json

  - name: llama_cpp_preflight
    script: scripts/run_llama_cpp_benchmark.py
    backend: llama_cpp
    model: /models/model.gguf
    output: results/raw/llama_cpp_benchmark.json

  - name: native_probe_refresh
    backend: native_probes
    coverage_source: native_probe_runner
    coverage_manifest: scripts/run_native_probes.py::PROBES
    build_dir: build
    results: results/raw
    output: results/raw/native_probe_run.json

  - name: quality_eval_refresh
    script: scripts/evaluate_backend_quality.py
    backend: quality
    output: results/raw/backend_quality_eval.json

  - name: profiling_artifacts_import
    script: scripts/parse_profiling_artifacts.py
    backend: profiling
    output: results/raw/profiling_artifacts.json

  - name: backend_comparison_refresh
    script: scripts/compare_backends.py
    backend: comparison
    output: results/raw/backend_comparison.json

  - name: cuda_profile_matrix_plan
    script: scripts/run_cuda_profile_matrix.py
    backend: cuda
    output: results/raw/cuda_profile_matrix.json

  - name: llama_cpp_matrix_plan
    script: scripts/run_llama_cpp_matrix.py
    backend: llama_cpp
    output: results/raw/llama_cpp_matrix.json

  - name: android_edge_benchmark_plan
    script: scripts/run_android_edge_benchmark.py
    backend: android
    output: results/raw/android_edge_benchmark.json

  - name: source_trace_verification
    script: scripts/verify_source_traces.py
    backend: source_trace
    output: results/raw/source_trace_verification.json

  - name: evidence_checklist_refresh
    script: scripts/render_evidence_checklist.py
    backend: evidence
    output: results/raw/evidence_checklist.json
  - name: structured_outputs_refresh
