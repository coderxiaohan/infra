global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Start node_exporter with a textfile collector directory, for example:
# node_exporter --collector.textfile.directory=/opt/inferlab/textfile
# Then copy or symlink InferLab's generated inferlab_metrics.prom into that directory.
scrape_configs:
  - job_name: inferlab-node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          project: inferlab
